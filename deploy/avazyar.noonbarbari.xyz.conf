# nginx vhost for avazyar.noonbarbari.xyz — Avazyar static PWA (docker, 127.0.0.1:8793).
# Install pattern matches the other noonbarbari vhosts:
#   sudo cp deploy/avazyar.noonbarbari.xyz.conf /etc/nginx/sites-available/avazyar.noonbarbari.xyz
#   sudo ln -sf /etc/nginx/sites-available/avazyar.noonbarbari.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d avazyar.noonbarbari.xyz   (after DNS resolves; adds the 443 block and the redirect)

server {
    listen 80;
    server_name avazyar.noonbarbari.xyz;

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
