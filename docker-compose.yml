services:
  avazyar:
    build: .
    # deploy/deploy.sh sets AVAZYAR_TAG to the app version, so earlier images stay available for rollback
    image: avazyar:${AVAZYAR_TAG:-local}
    container_name: avazyar
    restart: unless-stopped
    ports:
      # localhost only: the host's nginx terminates TLS and proxies in
      - "127.0.0.1:${AVAZYAR_PORT:-8793}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
