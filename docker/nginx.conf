# Static server for the Avazyar PWA. TLS is terminated by the reverse proxy in front.

# Files are not fingerprinted, so everything revalidates (ETag -> 304) and a new
# deploy is picked up on the next load. Icons and fonts rarely change, so they may be cached.
map $uri $cache_control {
    default      "no-cache";
    ~^/icons/    "public, max-age=604800";
    ~^/fonts/    "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/manifest+json;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The app needs the microphone and nothing else
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # Everything is served from this origin; nothing is loaded from third parties
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Not in this nginx's mime.types; browsers want the manifest type for installability
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
